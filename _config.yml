title: ROCm 7.14 vs ROCm 10.1 with vllm-radiance
description: ROCm runtime comparison on R9700 hardware using vllm-radiance and Qwen3.8 coding-agent workloads.
theme: jekyll-theme-primer
markdown: kramdown
kramdown:
  input: GFM
  parse_block_html: true
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
exclude:
  - Gemfile
  - Gemfile.lock
  - runbook.md
  - tools
  - render-check
  - "**/._*"
