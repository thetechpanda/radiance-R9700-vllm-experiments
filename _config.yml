title: R9700 field notes — vllm-radiance vs radiance
description: Coding-agent experiments on Radeon AI PRO R9700 — latency, generation, memory and delivered work across vllm-radiance and radiance.
theme: jekyll-theme-primer
markdown: kramdown
kramdown:
  input: GFM
  parse_block_html: true
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
exclude:
  - src
  - AGENTS.md
  - docs/stilldeadcode-radiance
  - Gemfile
  - Gemfile.lock
  - runbook.md
  - tools
  - render-check
  - "**/._*"
