<text x="30.0" y="583.0" font-size="13" fill="#e2e8f0" text-anchor="start">Text/vision histories and cache-hit rates differ: observed increments do not isolate image-compute cost. Seed sensitivity matters.</text>
<text x="30.0" y="608.0" font-size="13" fill="#94a3b8" text-anchor="start">Swift non-spec uses S4 as its text twin; using repeat S6 changes +44.1% to +22.3%. W4A16 vision cells have unusually high cache hits.</text>
<text x="30.0" y="633.0" font-size="13" fill="#94a3b8" text-anchor="start">Deep-band absence means no observation at that depth, not zero latency. See the band heatmap and source CSV.</text>
