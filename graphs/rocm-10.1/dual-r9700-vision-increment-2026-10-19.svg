<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="654" viewBox="0 0 1440 654" role="img" font-family="system-ui, sans-serif" fill="#e2e8f0">
<title>Vision-input increment: image cell minus its four-agent text twin</title><desc>One procedural 512×512 PNG per agent per turn; synthetic input stress, not a real game-building fleet. Each comparison stays within its target and lane.</desc>
