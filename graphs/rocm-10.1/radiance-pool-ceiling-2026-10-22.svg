<text x="36" y="735" font-size="14" fill="#9cacc0" text-anchor="start" font-weight="normal">GPU tokens store live KV; host-tier tokens store completed conversation state. Do not sum for live concurrency.</text>
<text x="36" y="767" font-size="14" fill="#9cacc0" text-anchor="start" font-weight="normal">Driver-max tier is a theoretical cap before vision/host reservations; it is not a usable 15.29 GiB prefix budget.</text>
<text x="36" y="805" font-size="13" fill="#9cacc0" text-anchor="start" font-weight="normal">Source: radiance-pool-ceiling-2026-10-22.csv. Latest allocation is not a sustained six-agent 200k benchmark.</text>
