<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Falling Blocks</title>
<style>
  :root {
    --bg: #f7f4ef;
    --panel: #fffdf9;
    --ink: #4a4453;
    --line: #e4ded6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    gap: 10px;
    touch-action: manipulation;
  }
  h1 {
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.06em;
  }
  #layout {
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  #boardWrap {
    background: #fbfaf7;
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 6px;
    box-shadow: 0 2px 10px rgba(80, 70, 90, 0.08);
  }
  canvas { display: block; border-radius: 4px; }
  #side {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 132px;
  }
  .card {
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 8px;
  }
  .card h2 {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0.65;
    margin-bottom: 6px;
    text-align: center;
  }
  .card canvas { margin: 0 auto; }
  .stat { text-align: center; font-variant-numeric: tabular-nums; }
  .stat .v { font-size: 1.15rem; font-weight: 600; }
  #stats .row { display: flex; justify-content: space-between; padding: 2px 4px; font-size: 0.9rem; }
  #help {
    font-size: 0.72rem;
    line-height: 1.5;
    opacity: 0.75;
  }
  #help b { font-weight: 600; }
  #controls {
    display: none;
    gap: 8px;
    width: 100%;
    max-width: 460px;
    justify-content: space-between;
  }
  #controls button {
    flex: 1;
    min-width: 52px;
    min-height: 52px;
    font-size: 1.25rem;
    border-radius: 12px;
    border: 2px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    box-shadow: 0 2px 0 rgba(80,70,90,0.12);
    user-select: none;
    -webkit-user-select: none;
  }
  #controls button:active { transform: translateY(1px); box-shadow: none; }
  @media (max-width: 620px), (pointer: coarse) {
    #layout { flex-direction: column; align-items: center; }
    #side {
      width: auto;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
    }
    #side .card { flex: 1 1 90px; }
    #help { display: none; }
    #controls { display: flex; }
    #stats { flex: 1 1 180px; }
  }
</style>
</head>
<body>
<h1>FALLING BLOCKS</h1>

<div id="layout">
  <div id="boardWrap"><canvas id="board"></canvas></div>
  <div id="side">
    <div class="card"><h2>Hold</h2><canvas id="hold"></canvas></div>
    <div class="card"><h2>Next</h2><canvas id="next"></canvas></div>
    <div class="card" id="stats">
      <div class="row"><span>Score</span><span class="v" id="score">0</span></div>
      <div class="row"><span>Lines</span><span class="v" id="lines">0</span></div>
      <div class="row"><span>Level</span><span class="v" id="level">1</span></div>
    </div>
    <div class="card" id="help">
      <b>&larr;/&rarr;</b> move &middot; <b>&darr;</b> soft<br>
      <b>&uarr;</b> rotate &middot; <b>Z</b> rot.<br>
      <b>Space</b> drop &middot; <b>C</b> hold<br>
      <b>P</b> pause &middot; <b>R</b> restart
    </div>
  </div>
</div>

<div id="controls">
  <button id="btnLeft" aria-label="move left">&#9664;</button>
  <button id="btnRight" aria-label="move right">&#9654;</button>
  <button id="btnRot" aria-label="rotate">&#10227;</button>
  <button id="btnSoft" aria-label="soft drop">&#9660;</button>
  <button id="btnHard" aria-label="hard drop">&#10515;</button>
  <button id="btnHold" aria-label="hold">&#9719;</button>
</div>

<script>
"use strict";
/* ---------------- Constants ---------------- */
const COLS = 10, ROWS = 20, SEED = 103;
const CLEAR_SCORES = [0, 100, 300, 500, 800];
const BASE_GRAVITY = 800, GRAVITY_STEP = 100, MIN_GRAVITY = 120;
const SOFT_DROP_MS = 50, LOCK_DELAY_MS = 500;
const MOVE_DELAY = 150, MOVE_REPEAT = 80;

/* Pastel palette on a light background */
const COLORS = {
  I: "#9ad7e6", O: "#f4e3a1", T: "#d5b8e0", S: "#b5e0bd",
  Z: "#f2b8b8", J: "#b3c7ee", L: "#f5cba5"
};
const TYPES = ["I", "O", "T", "S", "Z", "J", "L"];

/* Base shapes as [row, col] offsets in a small box */
const SHAPES = {
  I: [[0,0],[0,1],[0,2],[0,3]],
  O: [[0,0],[0,1],[1,0],[1,1]],
  T: [[0,1],[1,0],[1,1],[1,2]],
  S: [[0,1],[0,2],[1,0],[1,1]],
  Z: [[0,0],[0,1],[1,1],[1,2]],
  J: [[0,0],[1,0],[1,1],[1,2]],
  L: [[0,2],[1,0],[1,1],[1,2]]
};

/* Precompute rotation states: rotate clockwise around the shape's box */
function rotateCells(cells) {
  // rotate (r,c) -> (c, maxR - r) within bounding box
  const maxR = Math.max(...cells.map(c => c[0]));
  const maxC = Math.max(...cells.map(c => c[1]));
  const out = cells.map(([r, c]) => [c, maxR - r]);
  // normalise to top-left
  const minR = Math.min(...out.map(p => p[0]));
  const minC = Math.min(...out.map(p => p[1]));
  return out.map(([r, c]) => [r - minR, c - minC]);
}
const ROT = {};
for (const t of TYPES) {
  ROT[t] = [SHAPES[t]];
  for (let i = 1; i < 4; i++) ROT[t].push(rotateCells(ROT[t][i - 1]));
}
/* Spawn positions: centre horizontally in the 10-wide board */
const SPAWN_X = {}, SPAWN_Y = {};
for (const t of TYPES) {
  const w = Math.max(...ROT[t][0].map(c => c[1])) + 1;
  SPAWN_X[t] = Math.floor((COLS - w) / 2);
  SPAWN_Y[t] = 0;
}

/* ---------------- Seeded RNG (Mulberry32), seed 103 ---------------- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------------- Game state ---------------- */
let G;
function newGame() {
  const rng = mulberry32(SEED);
  G = {
    board: new Array(ROWS * COLS).fill(0),
    current: null,
    held: null,
    canHold: true,
    rng,
    bag: [],
    queue: [],
    score: 0, lines: 0, level: 1,
    acc: 0, lastT: 0,
    groundedSince: -1,
    status: "play"
  };
  refillQueue();
  spawn();
  syncHud();
  draw();
}

function refillQueue() {
  while (G.queue.length < 4) {
    if (G.bag.length === 0) {
      G.bag = TYPES.slice();
      for (let i = G.bag.length - 1; i > 0; i--) {
        const j = Math.floor(G.rng() * (i + 1));
        [G.bag[i], G.bag[j]] = [G.bag[j], G.bag[i]];
      }
    }
    G.queue.push(G.bag.pop());
  }
}

function collides(cells, ox, oy) {
  for (const [r, c] of cells) {
    const x = ox + c, y = oy + r;
    if (x < 0 || x >= COLS || y >= ROWS) return true;
    if (y >= 0 && G.board[y * COLS + x]) return true;
  }
  return false;
}

function pieceCells(p) { return ROT[p.type][p.rot]; }

function spawn() {
  const type = G.queue.shift();
  refillQueue();
  const p = { type, rot: 0, x: SPAWN_X[type], y: SPAWN_Y[type] };
  if (collides(pieceCells(p), p.x, p.y)) {
    G.current = p;
    G.status = "over";
    syncHud();
    draw();
    return;
  }
  G.current = p;
  G.acc = 0;
  G.groundedSince = -1;
  G.canHold = true;
}

function tryMove(dx, dy) {
  const p = G.current;
  if (!p || G.status !== "play") return false;
  if (collides(pieceCells(p), p.x + dx, p.y + dy)) return false;
  p.x += dx; p.y += dy;
  return true;
}

function tryRotate(dir) {
  const p = G.current;
  if (!p || G.status !== "play") return;
  if (p.type === "O") return;
  const rot = (p.rot + dir + 4) % 4;
  const cells = ROT[p.type][rot];
  const kicks = [0, -1, 1, -2, 2];
  for (const k of kicks) {
    if (!collides(cells, p.x + k, p.y)) {
      p.rot = rot; p.x += k;
      return;
    }
  }
}

function ghostY() {
  const p = G.current;
  let y = p.y;
  while (!collides(pieceCells(p), p.x, y + 1)) y++;
  return y;
}

function stepDown(isSoft) {
  const p = G.current;
  if (tryMove(0, 1)) {
    G.groundedSince = -1;
    if (isSoft) { G.score += 1; syncHud(); }
  } else {
    lockPiece();
  }
}

function hardDrop() {
  const p = G.current;
  if (!p || G.status !== "play") return;
  const dist = ghostY() - p.y;
  p.y += dist;
  G.score += 2 * dist;
  lockPiece();
}

function lockPiece() {
  const p = G.current;
  for (const [r, c] of pieceCells(p)) {
    const x = p.x + c, y = p.y + r;
    if (y >= 0) G.board[y * COLS + x] = p.type;
  }
  clearLines();
  spawn();
  syncHud();
  draw();
}

function clearLines() {
  let n = 0;
  for (let y = ROWS - 1; y >= 0; y--) {
    let full = true;
    for (let x = 0; x < COLS; x++)
      if (!G.board[y * COLS + x]) { full = false; break; }
    if (full) {
      G.board.splice(y * COLS, COLS);
      G.board.unshift(...new Array(COLS).fill(0));
      n++;
      y++; // recheck this row index after the shift
    }
  }
  if (n > 0) {
    G.score += CLEAR_SCORES[n] * G.level;
    G.lines += n;
    G.level = 1 + Math.floor(G.lines / 10);
  }
}

function holdPiece() {
  const p = G.current;
  if (!p || G.status !== "play" || !G.canHold) return;
  const t = p.type;
  G.current = G.held
    ? { type: G.held, rot: 0, x: SPAWN_X[G.held], y: SPAWN_Y[G.held] }
    : { type: t, rot: 0, x: SPAWN_X[t], y: SPAWN_Y[t] };
  if (collides(pieceCells(G.current), G.current.x, G.current.y)) {
    // extremely unlikely; cancel the swap
    G.held = t;
    G.current = p;
    return;
  }
  G.held = t;
  G.canHold = false;
  G.acc = 0;
  G.groundedSince = -1;
  draw();
}

function gravityMs() {
  return Math.max(MIN_GRAVITY, BASE_GRAVITY - (G.level - 1) * GRAVITY_STEP);
}

/* ---------------- Input ---------------- */
const keys = { left: false, right: false, down: false };
let lastMove = 0;

function onKeyDown(e) {
  const k = e.key;
  if (k === "ArrowLeft" || k === "ArrowRight" || k === "ArrowDown" || k === " ")
    e.preventDefault();
  if (e.repeat) {
    if (k === "ArrowLeft") keys.left = true;
    else if (k === "ArrowRight") keys.right = true;
    else if (k === "ArrowDown") keys.down = true;
    return;
  }
  switch (k) {
    case "ArrowLeft": keys.left = true; lastMove = performance.now(); tryMove(-1, 0); break;
    case "ArrowRight": keys.right = true; lastMove = performance.now(); tryMove(1, 0); break;
    case "ArrowDown": keys.down = true; break;
    case "ArrowUp": tryRotate(1); break;
    case "x": case "X": tryRotate(1); break;
    case "z": case "Z": tryRotate(-1); break;
    case " ": hardDrop(); break;
    case "c": case "C": holdPiece(); break;
    case "p": case "P": case "Enter": togglePause(); break;
    case "r": case "R": newGame(); break;
  }
  draw();
}

function onKeyUp(e) {
  switch (e.key) {
    case "ArrowLeft": keys.left = false; break;
    case "ArrowRight": keys.right = false; break;
    case "ArrowDown": keys.down = false; break;
  }
}

function togglePause() {
  if (G.status === "play") G.status = "paused";
  else if (G.status === "paused") { G.status = "play"; G.lastT = 0; }
  syncHud();
  draw();
}

/* Mobile buttons: long-press repeat for movement/soft drop */
function bindHoldButton(id, onDown, onUp) {
  const el = document.getElementById(id);
  const start = (e) => { e.preventDefault(); onDown(); };
  const end = (e) => { if (onUp) { e.preventDefault(); onUp(); } };
  el.addEventListener("touchstart", start, { passive: false });
  el.addEventListener("touchend", end);
  el.addEventListener("mousedown", start);
  el.addEventListener("mouseup", end);
  el.addEventListener("mouseleave", () => { if (onUp) onUp(); });
}
bindHoldButton("btnLeft",  () => { keys.left = true; lastMove = performance.now(); tryMove(-1, 0); }, () => { keys.left = false; });
bindHoldButton("btnRight", () => { keys.right = true; lastMove = performance.now(); tryMove(1, 0); }, () => { keys.right = false; });
bindHoldButton("btnSoft",  () => { keys.down = true; }, () => { keys.down = false; });
bindHoldButton("btnRot",   () => tryRotate(1));
bindHoldButton("btnHard",  () => hardDrop());
bindHoldButton("btnHold",  () => holdPiece());

window.addEventListener("keydown", onKeyDown);
window.addEventListener("keyup", onKeyUp);

/* ---------------- Rendering ---------------- */
const boardCv = document.getElementById("board");
const bctx = boardCv.getContext("2d");
const holdCv = document.getElementById("hold");
const hctx = holdCv.getContext("2d");
const nextCv = document.getElementById("next");
const nctx = nextCv.getContext("2d");

let CELL = 28;
function resize() {
  const vw = Math.min(window.innerWidth - 40, 520);
  const vh = Math.min(window.innerHeight - 220, 720);
  CELL = Math.max(14, Math.floor(Math.min(vw / COLS, vh / ROWS)));
  const dpr = window.devicePixelRatio || 1;
  boardCv.width = COLS * CELL * dpr;
  boardCv.height = ROWS * CELL * dpr;
  boardCv.style.width = COLS * CELL + "px";
  boardCv.style.height = ROWS * CELL + "px";
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const m = 24; // mini cell
  for (const [cv, ctx] of [[holdCv, hctx], [nextCv, nctx]]) {
    cv.width = 90 * dpr; cv.height = (cv === nextCv ? 96 : 30) * dpr;
    cv.style.width = "90px";
    cv.style.height = (cv === nextCv ? "96px" : "30px");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  draw();
}

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.round(((n >> 16) & 255) * f));
  const g = Math.min(255, Math.round(((n >> 8) & 255) * f));
  const b = Math.min(255, Math.round((n & 255) * f));
  return `rgb(${r},${g},${b})`;
}

function drawCell(ctx, x, y, s, color, alpha) {
  const pad = 1;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.strokeStyle = shade(color, 0.75);
  ctx.lineWidth = 1.5;
  const r = Math.min(5, s * 0.2);
  const px = x + pad, py = y + pad, ps = s - pad * 2;
  ctx.beginPath();
  ctx.moveTo(px + r, py);
  ctx.arcTo(px + ps, py, px + ps, py + ps, r);
  ctx.arcTo(px + ps, py + ps, px, py + ps, r);
  ctx.arcTo(px, py + ps, px, py, r);
  ctx.arcTo(px, py, px + ps, py, r);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawMiniPiece(ctx, type, cx, cy, s) {
  const cells = ROT[type][0];
  const w = Math.max(...cells.map(c => c[1])) + 1;
  const h = Math.max(...cells.map(c => c[0])) + 1;
  const ox = cx - (w * s) / 2, oy = cy - (h * s) / 2;
  for (const [r, c] of cells)
    drawCell(ctx, ox + c * s, oy + r * s, s, COLORS[type], 1);
}

function draw() {
  const ctx = bctx;
  ctx.fillStyle = "#fbfaf7";
  ctx.fillRect(0, 0, COLS * CELL, ROWS * CELL);

  /* grid */
  ctx.strokeStyle = "rgba(120,110,120,0.10)";
  ctx.lineWidth = 1;
  for (let x = 1; x < COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x * CELL + 0.5, 0); ctx.lineTo(x * CELL + 0.5, ROWS * CELL); ctx.stroke();
  }
  for (let y = 1; y < ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * CELL + 0.5); ctx.lineTo(COLS * CELL, y * CELL + 0.5); ctx.stroke();
  }

  /* settled cells */
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      const t = G.board[y * COLS + x];
      if (t) drawCell(ctx, x * CELL, y * CELL, CELL, COLORS[t], 1);
    }

  const p = G.current;
  if (p && G.status !== "over") {
    /* translucent landing ghost */
    const gy = ghostY();
    for (const [r, c] of pieceCells(p)) {
      const y = gy + r, x = p.x + c;
      if (y < 0) continue;
      ctx.globalAlpha = 0.32;
      ctx.fillStyle = COLORS[p.type];
      ctx.fillRect(x * CELL + 2, y * CELL + 2, CELL - 4, CELL - 4);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = shade(COLORS[p.type], 0.7);
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x * CELL + 2.5, y * CELL + 2.5, CELL - 5, CELL - 5);
    }
    /* active piece */
    for (const [r, c] of pieceCells(p)) {
      const y = p.y + r, x = p.x + c;
      if (y < 0) continue;
      drawCell(ctx, x * CELL, y * CELL, CELL, COLORS[p.type], 1);
    }
  }

  /* overlays */
  if (G.status === "paused" || G.status === "over") {
    ctx.fillStyle = "rgba(250, 248, 244, 0.82)";
    ctx.fillRect(0, 0, COLS * CELL, ROWS * CELL);
    ctx.fillStyle = "#4a4453";
    ctx.textAlign = "center";
    ctx.font = "600 " + Math.max(18, CELL * 1.1) + "px system-ui, sans-serif";
    const cx = (COLS * CELL) / 2;
    if (G.status === "paused") {
      ctx.fillText("PAUSED", cx, ROWS * CELL * 0.45);
      ctx.font = "400 " + Math.max(12, CELL * 0.6) + "px system-ui, sans-serif";
      ctx.fillText("Press P to resume", cx, ROWS * CELL * 0.45 + CELL * 1.2);
    } else {
      ctx.fillText("GAME OVER", cx, ROWS * CELL * 0.42);
      ctx.font = "400 " + Math.max(12, CELL * 0.7) + "px system-ui, sans-serif";
      ctx.fillText("Score: " + G.score, cx, ROWS * CELL * 0.42 + CELL * 1.1);
      ctx.fillText("Press R to restart", cx, ROWS * CELL * 0.42 + CELL * 1.9);
    }
  }

  /* hold + next mini panels */
  hctx.clearRect(0, 0, 90, 30);
  if (G.held) drawMiniPiece(hctx, G.held, 45, 15, 15);
  else {
    hctx.fillStyle = "rgba(120,110,120,0.3)";
    hctx.font = "12px system-ui, sans-serif";
    hctx.textAlign = "center";
    hctx.fillText("empty", 45, 19);
  }
  nctx.clearRect(0, 0, 90, 96);
  for (let i = 0; i < 3; i++)
    if (G.queue[i]) drawMiniPiece(nctx, G.queue[i], 45, 16 + i * 32, 14);
}

function syncHud() {
  document.getElementById("score").textContent = G.score;
  document.getElementById("lines").textContent = G.lines;
  document.getElementById("level").textContent = G.level;
}

/* ---------------- Main loop ---------------- */
function loop(t) {
  if (G.status === "play") {
    if (G.lastT === 0) G.lastT = t;
    const dt = Math.min(100, t - G.lastT);
    G.lastT = t;

    /* held-direction movement with repeat */
    const now = t;
    if (keys.left || keys.right) {
      if (now - lastMove >= MOVE_DELAY) {
        if (tryMove(keys.left ? -1 : 1, 0)) lastMove = now;
      }
    } else {
      lastMove = 0;
    }

    /* gravity / soft drop */
    const interval = keys.down ? SOFT_DROP_MS : gravityMs();
    G.acc += dt;
    if (G.acc >= interval) {
      G.acc = 0;
      const moved = tryMove(0, 1);
      if (keys.down && moved) {
        G.score += 1; syncHud();
      }
      const grounded = !moved;
      if (!grounded) {
        G.groundedSince = -1;
      } else {
        if (G.groundedSince < 0) G.groundedSince = t;
        if (t - G.groundedSince >= LOCK_DELAY_MS) {
          lockPiece();
        }
      }
    }
    draw();
  } else {
    G.lastT = 0;
  }
  requestAnimationFrame(loop);
}

/* ---------------- Boot ---------------- */
window.addEventListener("resize", resize);
newGame();
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
